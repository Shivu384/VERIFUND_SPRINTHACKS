<!DOCTYPE html>
<html>
<head>
    <title>Threshold Predictor</title>
</head>
<body>
    <h1>Threshold Predictor</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Predict</button>
    </form>
    {% if prediction is not None %}
        <h2>Prediction: {{ prediction }}</h2>
    {% endif %}
</body>
</html>
