<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fancy Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-gray-100 to-gray-300 min-h-screen flex items-center justify-center">

  <div id="lg-loginbox" class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 id="lg-title" class="text-3xl font-bold mb-6 text-center text-gray-800">Welcome Back</h2>
    
    <form id="lg-loginform">
      <div class="mb-4">
        <label for="lg-email" class="form-label text-gray-700">Email address</label>
        <input type="email" class="form-control" id="lg-email" placeholder="Enter your email">
      </div>

      <div class="mb-4">
        <label for="lg-password" class="form-label text-gray-700">Password</label>
        <input type="password" class="form-control" id="lg-password" placeholder="Enter your password">
      </div>

      <div class="d-flex justify-content-between mb-3">
        <a id="lg-forgot" href="#" class="text-sm text-blue-600 hover:underline">Forgot Password?</a>
        <a id="lg-create" href="register.html" class="text-sm text-blue-600 hover:underline">Create New Account</a>
      </div>

     </a> <button type="submit" id="lg-submit" class="btn btn-primary w-100 mb-3">Login</button>

      <div class="text-center text-gray-500 mb-2">OR</div>

      <button type="button" id="lg-google" class="btn btn-outline-danger w-100 flex items-center justify-center gap-2">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
        <span>Login with Google</span>
      </button>
    </form>
  </div>

</body>
</html>
