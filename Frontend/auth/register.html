<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-gray-200 to-gray-400 min-h-screen flex items-center justify-center">

  <div id="rs-box" class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 id="rs-title" class="text-3xl font-bold mb-6 text-center text-gray-800">Create Account</h2>
    
    
    <form id="rs-form">
        <div class="mb-4">
            <label for="rs-name" class="form-label text-gray-700">Name</label>
            <input type="tel" class="form-control" id="rs-phone" placeholder="Enter your Name">
          </div>
      <div class="mb-4">
        <label for="rs-phone" class="form-label text-gray-700">Phone Number</label>
        <input type="tel" class="form-control" id="rs-phone" placeholder="Enter phone number">
      </div>

      <div class="mb-4">
        <label for="rs-email" class="form-label text-gray-700">Email address</label>
        <input type="email" class="form-control" id="rs-email" placeholder="Enter email">
      </div>

      <div class="mb-4">
        <label for="rs-password" class="form-label text-gray-700">Password</label>
        <input type="password" class="form-control" id="rs-password" placeholder="Enter password">
      </div>

      <button type="submit" id="rs-submit" class="btn btn-success w-100 mb-3">Sign Up</button>

      <div class="text-center text-gray-500 mb-2">OR</div>
      <a href="../kyc/verification.html">
      <button type="button" id="rs-google" class="btn btn-outline-danger w-100 flex items-center justify-center gap-2">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
        <span>Sign up with Google</span>
      </button>
      </a>
      <div class="text-center mt-4">
        <a id="rs-loginlink" href="login.html" class="text-sm text-blue-600 hover:underline">Already registered? Login</a>
      </div>
    </form>
  </div>

</body>
</html>
