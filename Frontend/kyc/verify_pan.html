<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAN KYC Verification - Verifund</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .verification-container {
      background-image: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
    }
    
    .progress-bar {
      transition: width 0.6s ease;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="container mx-auto flex items-center justify-center">
    <!-- Left Info Section -->
    <div class="hidden md:flex flex-col items-center justify-center bg-blue-600 text-white p-12 rounded-l-2xl shadow-lg h-[650px] w-full max-w-md verification-container bg-cover bg-center" style="background-image: url('https://akm-img-a-in.tosshub.com/indiatoday/images/story/202412/pan-card-for-minors-102808800-1x1.jpg?VersionId=X35qQHMCo.FsEmIcAuLRls8rJ_I8ZgX6');">
        <div class="text-center bg-grey-1000/70 p-6 rounded-xl">
          <h1 class="text-4xl font-bold text-blue-200 mb-4">PAN Verification</h1>
          <p class="text-xl mb-8">Secure KYC process with Verifund</p>
      
          <div class="bg-white/10 p-6 rounded-xl mb-8">
            <h3 class="text-xl text-black-600 font-semibold mb-3">Requirements:</h3>
            <ul class="text-left space-y-2 text-white">
              <li class="flex items-center"><span class="mr-2 text-green-300">✓</span> Clear PAN card image</li>
              <li class="flex items-center"><span class="mr-2 text-green-300">✓</span> Matching personal details</li>
              <li class="flex items-center"><span class="mr-2 text-green-300">✓</span> Valid PAN number format</li>
            </ul>
          </div>
      
        </div>
      </div>
      
    
    <!-- Right Form Section -->
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md h-[650px] flex flex-col justify-center md:rounded-l-none md:rounded-r-2xl">
      <div class="text-center mb-6">
        <h2 class="text-3xl font-bold text-gray-800">PAN KYC Verification</h2>
        <p class="text-gray-600 mt-2">Complete your identity verification</p>
      </div>
      
      <form id="kycForm" class="space-y-4">
        <div>
          <label for="panNumber" class="block text-sm font-medium text-gray-700 mb-1">PAN Number</label>
          <input type="text" id="panNumber" required 
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                 placeholder="ABCDE1234F">
          <p class="text-xs text-gray-500 mt-1">Enter your 10-digit PAN number</p>
        </div>
        
        <div>
          <label for="dob" class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
          <input type="date" id="dob" required 
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
        </div>
        
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name as per PAN</label>
          <input type="text" id="name" required 
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                 placeholder="As shown on your PAN card">
        </div>
        
        
        <div class="pt-2">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200 flex items-center justify-center">
            <span id="submitText">Verify PAN</span>
            <svg id="loadingSpinner" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </button>
        </div>
      </form>
      
      <div id="progressContainer" class="hidden mt-4">
        <div class="flex justify-between text-sm text-gray-600 mb-1">
          <span>Verification Progress</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2.5">
          <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full progress-bar" style="width: 0%"></div>
        </div>
      </div>
      
      <div id="message" class="mt-4 p-3 rounded-lg text-center hidden"></div>
      <div id="result" class="mt-4 p-4 bg-gray-50 rounded-lg hidden"></div>
    </div>
  </div>

  <script>
   
    
   
    document.getElementById('kycForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const submitText = document.getElementById('submitText');
      const spinner = document.getElementById('loadingSpinner');
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');
      
      // Show loading state
      submitText.textContent = "Verifying...";
      spinner.classList.remove('hidden');
      submitBtn.disabled = true;
      progressContainer.classList.remove('hidden');
      
      // Simulate progress
      let progress = 0;
      const progressInterval = setInterval(() => {
        progress += Math.random() * 10;
        if (progress > 100) progress = 100;
        progressBar.style.width = `${progress}%`;
        progressPercent.textContent = `${Math.round(progress)}%`;
        
        if (progress === 100) {
          clearInterval(progressInterval);
          setTimeout(() => {
            showResult();
          }, 500);
        }
      }, 300);
    });
    
    function showResult() {
      const messageDiv = document.getElementById('message');
      const resultDiv = document.getElementById('result');
      
      // For demo purposes - in real app this would come from your verification API
      messageDiv.classList.remove('hidden');
      messageDiv.textContent = "PAN verification successful!";
      messageDiv.className = "mt-4 p-3 rounded-lg text-center bg-green-100 text-green-800";
      
      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = `
        <h4 class="font-medium text-gray-800 mb-2">Verification Details:</h4>
        <div class="space-y-2">
          <p><span class="font-medium">PAN Number:</span> ${document.getElementById('panNumber').value}</p>
          <p><span class="font-medium">Name:</span> ${document.getElementById('name').value}</p>
          <p><span class="font-medium">Status:</span> <span class="text-green-600">Verified</span></p>
        </div>
      `;
      
      // Reset form state
      const submitBtn = document.querySelector('button[type="submit"]');
      const submitText = document.getElementById('submitText');
      const spinner = document.getElementById('loadingSpinner');
      
      submitText.textContent = "Verify PAN";
      spinner.classList.add('hidden');
      submitBtn.disabled = false;
    }
  </script>
</body>
</html>
